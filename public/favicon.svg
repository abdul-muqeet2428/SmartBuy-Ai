<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#070B18" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.6" />
  <!-- Shopping Bag outline -->
  <path d="M28 38 L72 38 L67 80 L33 80 Z" fill="none" stroke="url(#glowGrad)" stroke-width="5" stroke-linejoin="round" filter="url(#neon)" />
  <!-- Bag Handle -->
  <path d="M38 38 C38 24 62 24 62 38" fill="none" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round" />
  <!-- AI Sparkle / Star in center -->
  <path d="M50 48 L52.5 56 L60 58.5 L52.5 61 L50 69 L47.5 61 L40 58.5 L47.5 56 Z" fill="#00ffcc" filter="url(#neon)" />
  <circle cx="62" cy="50" r="2" fill="#ff0080" />
</svg>

